name: Patch V4.6 Timing Temp

on:
  push:
    branches:
      - feature/v4.6-precise-timing-control

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add temporary V4.6 timing patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-precise-timing-control

      - name: Patch video prompt compiler
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai-native-video-architect-zh/prompt-engineering/video-prompt-compiler.md')
          text = path.read_text(encoding='utf-8')

          marker_1 = '禁止将“电影感、真实光照、缓慢推进”当成完整描述。\n'
          insert_1 = '''禁止将“电影感、真实光照、缓慢推进”当成完整描述。\n\n## 完整导演设计继承合同\n\n动态时间控制是视频Prompt的执行叠加层，不是新的简化版Prompt，也不得替代已经批准的导演完整设计。每条最终Prompt在加入秒点、时间窗和同步事件前，必须继续保留并执行：\n\n- 景别、机位、焦段感、构图、前中后景、主体位置、留白、轴线和屏幕方向；\n- 摄影机起点、运镜类型、方向、幅度、速度曲线、终点和叙事动机；\n- 焦点、景深、曝光、白平衡、高光保护、暗部层次和运动模糊；\n- 主光真实来源、世界位置、方向、软硬、色温、强度、光比、受光区和阴影区；\n- 主色、辅助色、点缀色、饱和度、对比度、黑位、高光与光色连续性；\n- 人物身份、服装、表演、微表情、呼吸、重心、手部、动作物理和情绪曲线；\n- 场景结构、背景职责、环境事件、材质分层运动、声音、首尾帧和跨镜连续性。\n\n时间轴只回答这些既有设计在什么时候开始、何时发生关键变化、哪些系统同步响应、运动如何衰减以及最终在哪里收住。时间容量不足或执行冲突时，优先调整时间分配、减少并发、拆镜、使用首尾帧、抽尾帧续拍或分层生成；不得通过删除镜头、视觉、色彩、灯光、材质、表演、环境、声音或连续性信息解决。\n'''
          if marker_1 not in text:
              raise SystemExit('marker_1 not found')
          text = text.replace(marker_1, insert_1, 1)

          marker_2 = '## 三、时间轴动作编译\n'
          insert_2 = '''## 三-A、动态时间控制等级\n\n不是所有镜头都强制逐秒工程化。先根据镜头风险选择：\n\n### RELATIVE_PHASE\n\n使用“前段稳定—中段发展—后段收住”的相对阶段。适用于呼吸、抬眼、轻微转头、缓慢走动、衣料与环境微动等低风险镜头。仍需写清顺序、幅度和尾态，但不机械设置多个绝对秒点。\n\n### ABSOLUTE_EVENT_ANCHOR\n\n关键接触、冲击、揭示、转身、道具状态改变、焦点切换或摄影机与人物同步响应时使用绝对时间锚点。锚点需要绑定同一因果事件中的人物、道具、环境、材质、摄影机、焦点、灯光和声音，防止提前、滞后、重复或无因运动。\n\n```yaml\ntiming_control:\n  mode: ABSOLUTE_EVENT_ANCHOR\n  duration:\n  pre_event_hold:\n  event_anchors:\n    - event_id:\n      exact_time_or_window:\n      preparation_start:\n      trigger_action:\n      exact_contact_or_change:\n      actor_response:\n      prop_response:\n      environment_and_material_response:\n      camera_response:\n      focus_response:\n      lighting_and_exposure_response:\n      sound_sync_point:\n      response_delay:\n      amplitude_numeric:\n      amplitude_visible_result:\n      decay_or_rebound:\n      settle_time:\n      forbidden_desynchronization: []\n  final_hold:\n```
\n数值必须和可见结果同时出现。例如“茶杯震起约2厘米，杯底清楚离开桌面但不倾倒”；“摄影机下沉约10厘米，只改变一个手掌宽度的观察高度，不形成大幅俯冲”。模型无法精确执行数值时，可见结果仍能约束运动幅度。\n\n### SPLIT_EXECUTION\n\n当同一镜头需要多人精确交互、复杂手部接触、多个道具连锁反应、人物与摄影机同时大幅运动，或多个绝对锚点互相争夺执行能力时，不继续增加Prompt长度。改用首尾帧、Bridge CF、两段生成、抽尾帧续拍、遮挡切换或分层合成。\n\n## 三、时间轴动作编译\n'''
          if marker_2 not in text:
              raise SystemExit('marker_2 not found')
          text = text.replace(marker_2, insert_2, 1)

          marker_3 = '### 收住\n\n写清最终姿态、手的位置、道具状态、视线、呼吸和稳定停留。不能在动作中间随机结束。\n'
          insert_3 = '''### 收住\n\n写清最终姿态、手的位置、道具状态、视线、呼吸和稳定停留。不能在动作中间随机结束。\n\n### 关键事件因果同步\n\n绝对事件锚点不能只给人物动作标时间，还要把事件的因果响应绑定在同一时点或明确延迟：\n\n```text\n人物起势\n→ 接触或状态变化\n→ 道具受力或改变\n→ 环境与材质响应\n→ 摄影机、焦点、灯光或声音按导演设计响应\n→ 惯性、余震或情绪残留逐渐衰减\n→ 停在结束帧合同\n```
\n必须明确哪些响应“同时发生”、哪些“延迟__秒”，以及哪些元素保持静止。禁止摄影机提前震动、物体无接触自行运动、冲击后持续漂浮、动作自动重复或灯光无动机闪烁。\n'''
          if marker_3 not in text:
              raise SystemExit('marker_3 not found')
          text = text.replace(marker_3, insert_3, 1)

          marker_4 = '- 用增加形容词代替运动因果，或因Prompt过载而应拆镜却仍强迫单次生成。\n'
          insert_4 = '''- 用增加形容词代替运动因果，或因Prompt过载而应拆镜却仍强迫单次生成。\n- 为加入绝对秒点而删除原有景别、构图、镜头、焦点、灯光、色彩、材质、表演、环境、声音、首尾帧或连续性设计；\n- 关键接触或冲击没有统一事件锚点，导致人物、道具、环境、摄影机、焦点、灯光或声音提前、滞后、重复或无因响应；\n- 只给厘米、角度和秒数，不说明观众在画面中应看到的幅度与结果；\n- 普通低风险镜头被机械拆成过多绝对秒点，时间格式挤压了表演和画面表达；\n- 复杂事件已经超过单次模型稳定能力，却不拆段、不使用首尾帧或分层生成。\n'''
          if marker_4 not in text:
              raise SystemExit('marker_4 not found')
          text = text.replace(marker_4, insert_4, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/patch-v46-timing-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-native-video-architect-zh/prompt-engineering/video-prompt-compiler.md .github/workflows/patch-v46-timing-temp.yml
          git commit -m "feat: integrate precise timing into full video prompt design"
          git push origin HEAD:feature/v4.6-precise-timing-control
