name: Package Refreshed AI Native Video Architect Skill

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill package
        run: python ai-native-video-architect-zh/scripts/validate_package.py
      - name: Build ZIP archive
        run: zip -r ai-native-video-architect-zh-v4.2.0.zip ai-native-video-architect-zh -x '*/__pycache__/*' '*.pyc' '*.pyo' '.DS_Store'
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-video-architect-zh-v4.2.0-refreshed
          path: ai-native-video-architect-zh-v4.2.0.zip
          if-no-files-found: error
          retention-days: 7
