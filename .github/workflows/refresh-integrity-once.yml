name: Refresh integrity hashes once

on:
  push:
    paths:
      - 'ai-native-video-architect-zh/**'

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[integrity-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh protected file hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('ai-native-video-architect-zh')
          integrity_path = root / 'constitution' / 'integrity.json'
          data = json.loads(integrity_path.read_text(encoding='utf-8'))

          add_paths = [
              'prompt-engineering/reference-media-usage-contract.md',
              'templates/video-prompt-block.md',
              'schemas/s11-video-prompt.schema.json',
              'evals/reference-media-usage-check.md',
          ]
          protected = data.setdefault('protected_files', {})
          for rel in add_paths:
              protected.setdefault(rel, '')

          missing = []
          for rel in sorted(protected):
              path = root / rel
              if not path.is_file():
                  missing.append(rel)
                  continue
              protected[rel] = hashlib.sha256(path.read_bytes()).hexdigest()

          if missing:
              raise SystemExit(f'Missing protected files: {missing}')

          data['algorithm'] = 'sha256'
          integrity_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit refreshed hashes
        run: |
          if git diff --quiet -- ai-native-video-architect-zh/constitution/integrity.json; then
            echo 'No integrity changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-native-video-architect-zh/constitution/integrity.json
          git commit -m '[integrity-refresh] Refresh protected hashes'
          git push
