version: 3.3.0

modes:
  story_director:
    description: 以人物任务、因果、选择、完整剧本和结尾为核心的叙事短片。
    triggers: [剧情, 人物, 冲突, 反转, 结局, 剧本, story, plot, screenplay, twist]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/high-concept-scifi.md
      - controllers/visual-narrative.md
      - controllers/camera-language.md
    optional_modules:
      - controllers/ai-production.md
      - controllers/virality.md
      - controllers/sound-design.md
    constraints:
      - 正式资产生产前必须完成S03剧本或视觉脚本和S04剧本拆解

  visual_director:
    description: 通过人物、动作、空间、物件和声画变化让观众自行推断故事。
    triggers: [视觉叙事, 无对白, 意识流, 氛围, 超现实, visual, cinematic, surreal]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/visual-narrative.md
      - controllers/camera-language.md
      - controllers/style-reference.md
      - controllers/sound-design.md
      - evals/visual-narrative-score.md
    constraints:
      - 禁止用旁白补足本应由画面承担的信息
      - 保留一个可观察的人物行动或关系变化
      - 无对白不等于无需视觉脚本，S03仍需完整可拆解文本

  blockbuster_director:
    description: 高概念、大片尺度、人物选择与可制作性并重。
    triggers: [科幻大片, 宇宙, 末日, 灾难, 史诗, blockbuster, epic, sci-fi]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/high-concept-scifi.md
      - controllers/visual-narrative.md
      - controllers/camera-language.md
      - controllers/ai-production.md
      - controllers/production-management.md
      - controllers/sound-design.md
      - controllers/virality.md
    constraints:
      - 只允许一个主机制
      - 只允许一个主任务
      - 奇观必须改变任务、代价、关系或真相
      - 先通过剧本、资产和Core Sample门槛，再批量制作奇观

  experimental_director:
    description: 形式、感知、重复、声音和图像关系优先。
    triggers: [实验, 抽象, 梦境, 诗性, 非线性, experimental, abstract, dream]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/visual-narrative.md
      - controllers/camera-language.md
      - controllers/style-reference.md
      - controllers/sound-design.md
    constraints:
      - 必须存在稳定形式规则
      - 随机奇观不等于意识流
      - 可以使用Visual Treatment和视觉脚本，不强制对白剧本

  production_director:
    description: 把已确认的剧本或视觉脚本拆成资产、镜头、提示词、生成顺序和后期计划。
    triggers: [制作, 分镜, prompt, 提示词, 角色一致, 场景一致, 首尾帧, Runway, Kling, Veo, Sora, ComfyUI, 落地]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/asset-first-production.md
      - controllers/ai-production.md
      - controllers/production-management.md
      - controllers/camera-language.md
      - controllers/detailed-storyboard.md
      - controllers/sound-design.md
    constraints:
      - 没有已确认剧本或视觉脚本时先返回S03
      - 用户自带资产先进入S08审核
      - Core Sample未通过不得批量生成

routing:
  preserve_existing_operation_modes: [CREATE, TRANSFORM, DIAGNOSE, ADAPT]
  selection_rules:
    - 每次首次调用先推断S00至S13当前阶段并显示紧凑进度
    - 先选择操作模式，再选择导演模式
    - 一个任务可以有一个主导演模式和最多两个辅助导演模式
    - 用户明确要求只诊断时，显示被诊断成果所属阶段，不自动推进
    - TRANSFORM显示原成果阶段、修改范围、保护项和返回阶段
    - 用户已有成熟成果时从对应阶段进入，不重复已完成访谈
    - 未经确认或审核的阶段不得标记完成
    - 用户未要求完整流程时，输出当前最小可决策层级
  confirmation_gates:
    - STORY_DIRECTION_CONFIRMATION
    - SCRIPT_CONFIRMATION
    - ASSET_CONFIRMATION
    - STORYBOARD_CONFIRMATION
    - CORE_SAMPLE_GATE
  recommended_hybrid:
    - 视觉钩子
    - 规则发现
    - 人物选择
    - 情绪重构
