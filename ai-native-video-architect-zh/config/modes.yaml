version: 4.0.0

modes:
  story_director:
    description: 以人物任务、因果、选择、完整剧本和结尾为核心。
    triggers: [剧情, 人物, 冲突, 反转, 结局, 剧本, story, plot, screenplay]
    required_modules: [config/progress-navigation.yaml, controllers/high-concept-scifi.md, controllers/visual-narrative.md, controllers/camera-language.md]
    optional_modules: [controllers/post-script-production.md, controllers/ai-production.md, controllers/sound-design.md]
    constraints: [正式资产生产前完成S03和S04]

  visual_director:
    description: 通过动作、空间、物件和声画变化让观众推断故事。
    triggers: [视觉叙事, 无对白, 意识流, 氛围, 超现实, visual, cinematic]
    required_modules: [config/progress-navigation.yaml, controllers/visual-narrative.md, controllers/camera-language.md, controllers/style-reference.md, controllers/sound-design.md]
    optional_modules: [controllers/post-script-production.md]
    constraints: [无对白仍需完整视觉脚本]

  blockbuster_director:
    description: 高概念、大片尺度、人物选择和可制作性并重。
    triggers: [科幻大片, 宇宙, 末日, 灾难, 史诗, blockbuster, epic, sci-fi]
    required_modules: [config/progress-navigation.yaml, controllers/high-concept-scifi.md, controllers/camera-language.md, controllers/ai-production.md, controllers/production-management.md, controllers/sound-design.md]
    optional_modules: [controllers/post-script-production.md]
    constraints: [剧本资产和Core Sample通过后才批量奇观]

  experimental_director:
    description: 形式、感知、重复、声音和图像关系优先。
    triggers: [实验, 抽象, 梦境, 诗性, 非线性, experimental, abstract]
    required_modules: [config/progress-navigation.yaml, controllers/visual-narrative.md, controllers/camera-language.md, controllers/style-reference.md, controllers/sound-design.md]
    optional_modules: [controllers/post-script-production.md]
    constraints: [必须存在稳定形式规则, 可使用完整视觉脚本]

  production_director:
    description: 把已确认剧本转成资产Prompt、分镜帧Prompt、视频Prompt、衔接和后期生产包。
    triggers: [制作, 分镜, prompt, 提示词, 生图, 图生视频, 角色一致, 场景一致, 首尾帧, 运镜, 续拍, 硬切, ComfyUI, Kling, Runway, Veo, Sora]
    required_modules:
      - config/progress-navigation.yaml
      - controllers/post-script-production.md
      - controllers/asset-first-production.md
      - controllers/ai-production.md
      - controllers/detailed-storyboard.md
      - prompt-engineering/image-prompt-compiler.md
      - prompt-engineering/visual-style-color-light.md
      - prompt-engineering/asset-prompt-system.md
      - prompt-engineering/storyboard-frame-system.md
      - prompt-engineering/video-prompt-compiler.md
      - prompt-engineering/camera-movement-library.md
      - prompt-engineering/continuity-repair-system.md
    constraints:
      - 没有已确认剧本时返回S03
      - S07和S10按阶段整批交付
      - 用户默认自行审核
      - 下一步表示进入下一阶段
      - Core Sample未通过不得批量生成

routing:
  preserve_existing_operation_modes: [CREATE, TRANSFORM, DIAGNOSE, ADAPT]
  selection_rules:
    - 首次调用推断S00至S13并显示进度
    - 先选择操作模式再选择导演模式
    - 用户已有成熟成果时从对应阶段进入
    - 未经确认的阶段不得标记完成
    - S07、S09、S10、S11和S12默认整批输出
    - 用户说下一步默认进入下一个阶段
    - 只有用户明确请求时才逐图辅助审核
  confirmation_gates: [STORY_DIRECTION_CONFIRMATION, SCRIPT_CONFIRMATION, ASSET_CONFIRMATION, STORYBOARD_CONFIRMATION, CORE_SAMPLE_GATE]
