version: 4.4.0

modes:
  story_director:
    description: 完成人物任务、关系、因果、关键选择、完整剧本和结尾。
    triggers: [剧情, 人物, 冲突, 反转, 结局, 剧本, story, plot, screenplay]
    required_modules: [core/story.md]

  visual_director:
    description: 用动作、空间、物件、灯光和声画变化完成视觉叙事。
    triggers: [视觉叙事, 无对白, 意识流, 氛围, 超现实, visual, cinematic]
    required_modules: [controllers/visual-narrative.md, controllers/camera-language.md]

  production_director:
    description: 在Agent内部把剧本完整编译为资产Prompt、Shot、CF、生图Prompt和生视频Prompt，供外部平台执行。
    triggers: [全套, 完整制作包, 分镜, prompt, 提示词, 生图, 图生视频, 首尾帧, CF, 控制帧, 外部平台实测, ComfyUI, Kling, Runway, Veo, Sora]
    required_modules:
      - controllers/agent-full-creation.md
      - controllers/post-script-production.md
      - controllers/camera-director.md
      - controllers/lighting-director.md
      - controllers/performance-director.md
      - references/emotion-library.md
      - prompt-engineering/performance-prompt-compiler.md
      - prompt-engineering/asset-prompt-system.md
      - prompt-engineering/shot-cf-binding-system.md
      - prompt-engineering/image-prompt-compiler.md
      - prompt-engineering/storyboard-frame-system.md
      - prompt-engineering/video-prompt-compiler.md
      - prompt-engineering/continuity-repair-system.md
      - evals/full-package-integrity-check.md
      - templates/full-creation-package.md
    constraints:
      - 全套请求不在参考图未生成处停止
      - CF固定为Control Frame并属于Shot
      - 每个Shot必须有可见描述、导演意图、摄影方向、逐镜灯光和非空参考绑定
      - 人物镜头必须有表演方向、情绪曲线和可继承的结束强度
      - 每个生成型Shot必须有图像来源和视频Prompt
      - 继承上一镜尾帧必须有明确CF来源和备用首帧Prompt
      - 输出前必须通过完整性覆盖率检查
      - 没有真实媒体时状态为PROMPT_PACKAGE_READY

routing:
  preserve_existing_operation_modes: [CREATE, TRANSFORM, DIAGNOSE, ADAPT]
  full_creation_triggers: [全套, 完整, 从剧本到提示词, 所有镜头, 外部平台创作, 实测]
  full_creation_route: CREATE_OR_TRANSFORM_THEN_ADAPT
  internal_confirmation_gates_only_when_user_requests_stepwise: true
