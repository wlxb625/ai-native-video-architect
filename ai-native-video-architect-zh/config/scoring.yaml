version: 3.3.0

scores:
  concept:
    minimum: 80
    weights:
      one_sentence_strength: 20
      mechanism_unity: 20
      character_task_and_choice: 20
      originality: 20
      retellability: 20

  visual_narrative:
    minimum: 80
    weights:
      character_world_relation: 20
      action_carries_information: 20
      motif_progression: 20
      reinterpretation: 20
      emotional_residue: 20

  camera_language:
    minimum: 75
    weights:
      shot_purpose: 20
      reveal_order: 20
      movement_motivation: 20
      visual_priority: 20
      editability: 20

  asset_readiness:
    minimum_for_storyboard_frames: 85
    conditional_for_core_sample: 70
    weights:
      character_identity: 20
      costume_states: 15
      environment_structure: 20
      prop_identity_and_states: 15
      frame_readiness: 15
      continuity_and_versioning: 15

  production:
    minimum: 75
    weights:
      character_consistency: 15
      environment_consistency: 15
      prop_and_costume_consistency: 15
      generation_feasibility: 20
      continuity_and_editing: 20
      fallback_readiness: 15

  sound:
    minimum: 75
    weights:
      world_sound: 20
      character_sound: 20
      motif: 20
      silence_and_space: 20
      picture_sound_relationship: 20

  propagation:
    minimum_when_requested: 75
    weights:
      opening_hook: 20
      iconic_shot: 20
      retellability: 20
      discussion_space: 20
      rewatch_value: 20

  director_package:
    minimum: 85
    weights:
      concept: 18
      visual_narrative: 18
      cinematic_language: 14
      emotional_arc: 14
      asset_readiness_or_fit: 12
      production: 12
      sound: 8
      propagation_or_artistic_fit: 4

status_rules:
  pass: score >= minimum and no hard failure
  conditional: score within 10 points below minimum or contains solvable production risk
  fail: hard failure exists or core layer cannot support the requested format

production_gates:
  before_storyboard_frames:
    - script or visual script confirmed
    - script breakdown completed
    - visual_bible established
    - asset_registry established
    - asset_readiness score >= 85 or explicitly marked exploratory
  before_batch_video_generation:
    - CORE_SAMPLE_GATE passed
    - character and environment consistency tested across at least two angles
    - key props and costume states versioned
    - first-frame/end-frame or hard-cut strategy defined
