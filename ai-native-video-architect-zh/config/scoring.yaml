version: 4.0.0

scores:
  concept:
    minimum: 80
    weights: {one_sentence_strength: 20, mechanism_unity: 20, character_task_and_choice: 20, originality: 20, retellability: 20}

  visual_narrative:
    minimum: 80
    weights: {character_world_relation: 20, action_carries_information: 20, motif_progression: 20, reinterpretation: 20, emotional_residue: 20}

  camera_language:
    minimum: 75
    weights: {shot_purpose: 20, reveal_order: 20, movement_motivation: 20, visual_priority: 20, editability: 20}

  asset_readiness:
    minimum_for_storyboard_frames: 85
    advisory_only_under_user_self_audit: true
    weights: {character_identity: 20, costume_states: 15, environment_structure: 20, prop_identity_and_states: 15, frame_readiness: 15, continuity_and_versioning: 15}

  prompt_production_readiness:
    minimum: 80
    conditional_for_core_sample: 70
    evaluator: evals/prompt-production-readiness-score.md
    weights:
      script_traceability: 10
      reference_roles: 10
      image_prompt_completeness: 15
      color_and_light: 10
      asset_consistency: 15
      frame_state_design: 10
      video_prompt_completeness: 15
      continuity_and_transitions: 10
      repair_and_fallback: 5

  production:
    minimum: 75
    weights: {character_consistency: 15, environment_consistency: 15, prop_and_costume_consistency: 15, generation_feasibility: 20, continuity_and_editing: 20, fallback_readiness: 15}

  director_package:
    minimum: 85
    weights: {concept: 16, visual_narrative: 16, cinematic_language: 12, emotional_arc: 12, asset_readiness_or_fit: 10, prompt_production: 14, production: 10, sound: 6, artistic_fit: 4}

status_rules:
  pass: score >= minimum and no hard failure
  conditional: score within 10 points below minimum or contains solvable production risk
  fail: hard failure exists or core layer cannot support requested format

production_gates:
  before_asset_prompts: [script confirmed, script breakdown completed, visual_bible established, asset_registry established]
  before_storyboard_frames: [user confirmed generated assets, shot design confirmed]
  before_batch_video_generation: [CORE_SAMPLE_GATE passed, character and environment tested, key props versioned, continuation strategy defined]
