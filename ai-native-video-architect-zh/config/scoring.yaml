version: 4.2.0

scores:
  concept:
    minimum: 80
    weights: {one_sentence_strength: 20, mechanism_unity: 20, character_task_and_choice: 20, originality: 20, retellability: 20}

  visual_narrative:
    minimum: 80
    weights: {character_world_relation: 20, action_carries_information: 20, motif_progression: 20, reinterpretation: 20, emotional_residue: 20}

  camera_language:
    minimum: 75
    weights: {shot_purpose: 20, reveal_order: 20, movement_motivation: 20, visual_priority: 20, editability: 20}

  reference_readiness:
    minimum_for_storyboard_frames: 80
    advisory_only_under_user_self_audit: true
    weights: {main_character_identity: 25, main_environment_structure: 25, core_prop_or_special_state: 15, visual_rule_consistency: 20, frame_reusability: 15}
    rule: 不以资产数量评分；少量参考能够稳定支持镜头即可通过。

  prompt_production_readiness:
    minimum: 85
    conditional_for_representative_test: 75
    evaluator: evals/prompt-production-readiness-score.md
    weights:
      script_traceability: 10
      source_template_fidelity: 8
      reference_roles: 8
      image_prompt_completeness: 10
      frame_and_end_state_design: 12
      generation_mode_selection: 10
      camera_and_optics: 12
      per_shot_lighting: 12
      video_timeline_and_physics: 10
      continuity_and_transitions: 5
      repair_and_fallback: 3

  production:
    minimum: 80
    weights:
      character_consistency: 12
      environment_consistency: 10
      prop_and_state_consistency: 8
      generation_feasibility: 18
      end_frame_reachability: 12
      camera_focus_and_lighting_stability: 18
      continuity_and_editing: 14
      fallback_readiness: 8

  director_package:
    minimum: 85
    weights: {concept: 14, visual_narrative: 14, cinematic_language: 12, emotional_arc: 10, reference_fit: 8, prompt_production: 22, production: 12, sound: 5, artistic_fit: 3}

status_rules:
  pass: score >= minimum and no hard failure
  conditional: score within 10 points below minimum or contains solvable production risk
  fail: hard failure exists or core layer cannot support requested format

production_gates:
  before_reference_prompts: [script confirmed or user supplied a complete script, visual rules sufficient for the requested images]
  before_storyboard_frames: [minimum core references available or user explicitly accepts text-only generation, shot design confirmed]
  before_video_prompts:
    - storyboard frame or other valid start image available
    - generation mode selected per shot
    - action timeline and exact end frame defined
    - camera, focus, exposure and per-shot lighting contracts defined
  before_batch_video_generation:
    - at least one representative shot tested when project risk justifies testing
    - end-frame reachability checked
    - lighting and focus stability checked
    - continuation strategy defined

hard_failures:
  - single_start_frame_used_when_next_shot_requires_exact_tail_state
  - missing_end_frame_contract
  - missing_camera_endpoint
  - missing_focus_depth_or_exposure
  - missing_real_light_source_direction_and_illuminated_areas
  - light_focus_or_exposure_drift_inside_one_shot
  - video_prompt_is_only_action_summary
