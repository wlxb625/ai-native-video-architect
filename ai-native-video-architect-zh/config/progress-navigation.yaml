version: 4.4.0

progress_navigation:
  enabled_by_default: false
  enable_when:
    - 用户明确要求按步骤推进
    - 用户询问当前进度
    - 任务发生阻塞或回退
  suppress_when:
    - 用户要求全套一次完成
    - 用户需要单个Prompt或单个修改
    - 进度提示会打断主要交付

  semantic_contract:
    DIRECT_ENTRY: true
    FULL_PACKAGE_WITHOUT_ASSET_GATE: true
    NEXT_MEANS_NEXT_DELIVERABLE: true
    rules:
      - 用户已有成果时直接从缺失部分开始
      - 全套请求中规划参考图尚未生成不阻塞Shot、CF和视频Prompt
      - 不要求用户逐资产或逐镜头确认
      - 用户说下一步表示继续下一个相关交付物或进入真实生成结果审核

  stages:
    - {id: S00, name: 创作需求, internal_only: true, deliverable: CREATIVE_BRIEF, next: S01}
    - {id: S01, name: 故事方向, internal_only: true, deliverable: STORY_DIRECTION, next: S02}
    - {id: S02, name: 故事方案, internal_only: true, deliverable: STORY_TREATMENT, next: S03}
    - {id: S03, name: 剧本或视觉脚本, internal_only: true, deliverable: SCRIPT_PACKAGE, next: S04}
    - {id: S04, name: 剧本制作拆解, internal_only: true, deliverable: SCRIPT_BREAKDOWN, next: S05}
    - {id: S05, name: 视觉圣经, internal_only: true, deliverable: VISUAL_BIBLE, next: S06}
    - {id: S06, name: 规划资产表, internal_only: true, deliverable: PLANNED_REFERENCE_REGISTRY, next: S07}
    - {id: S07, name: 基础资产Prompt, internal_only: true, deliverable: REFERENCE_PROMPT_PACK, next: S08}
    - {id: S08, name: 完整Shot表, internal_only: true, deliverable: COMPLETE_SHOT_LIST, next: S09}
    - {id: S09, name: Shot与CF绑定, internal_only: true, deliverable: SHOT_CF_BINDING_MAP, next: S10}
    - {id: S10, name: 控制帧Prompt, internal_only: true, deliverable: FRAME_PROMPT_PACK, next: S11}
    - {id: S11, name: 视频Prompt, internal_only: true, deliverable: VIDEO_PROMPT_PACK, next: S12}
    - {id: S12, name: 内部检查返修, internal_only: true, deliverable: INTERNAL_VALIDATION_SUMMARY, next: S13}
    - {id: S13, name: 完整提示词包, internal_only: true, deliverable: FULL_CREATION_PACKAGE, next: null}

  compact_display_example: |
    【项目进度】
    已完成：✓ 剧本 ✓ 视觉资产规划 ✓ Shot与CF绑定
    正在进行：逐镜头图片与视频Prompt内部校验
    本轮交付：完整制作提示词包
