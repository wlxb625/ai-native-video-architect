interface:
  display_name: "AI原生电影全流程工作室 V4.0"
  short_description: "从剧本拆解到整批资产生图Prompt、分镜帧、核心样片、视频Prompt、运镜、续拍、硬切、修复、后期和交付。"
  brand_color: "#5B5BD6"
  default_prompt: "使用 $ai-native-video-architect-zh。先判断我处于S00至S13哪一阶段并显示紧凑进度。剧本确认后必须读取内置Prompt工程模块：完成拆解、色调六轴与光影合同、资产计划，然后在S07一次性交付全部角色/场景/道具完整生图Prompt；我在外部工具自行生成和审核，回复‘下一步’表示进入下一阶段。S09一次性设计整片分镜，S10一次性交付全部首尾帧Prompt，S11交付核心样片视频Prompt，S12一次性交付全片图生视频、运镜、续拍、硬切、修复、剪辑、声音和调色方案。不要要求我每生成一张图就回来确认。"
policy:
  allow_implicit_invocation: true
