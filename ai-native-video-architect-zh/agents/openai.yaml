interface:
  display_name: "AI原生电影创作工作室 V4.2"
  short_description: "从创意与剧本继续完成核心参考图、分镜帧和导演级视频Prompt，包含逐镜摄影、灯光、焦点、尾帧、连续性与修复。"
  brand_color: "#5B5BD6"
  default_prompt: "使用 $ai-native-video-architect-zh。先判断我已经拥有想法、大纲、剧本、参考图、镜头表、分镜图还是视频片段，并直接从当前需要的位置开始。这个Skill既负责故事和剧本，也负责剧本确认后的核心参考图Prompt、分镜设计、分镜帧Prompt和导演级图生视频Prompt。普通短片默认使用最少必要参考图，不建立庞大资产库。视频Prompt不能只写动作摘要：必须先选择单首帧、首尾帧、抽尾帧续拍、遮挡硬切或分层合成；每镜写明前中后景、分秒动作、摄影机参数、焦点景深、曝光白平衡、逐镜真实灯光、精确结束帧和下一镜继承。下一镜依赖准确姿势、手部、道具、焦点或构图时，不得只使用无控制单首帧。用户提供Prompt资料时先读取原文并区分原资料与自行补充。"
policy:
  allow_implicit_invocation: true
