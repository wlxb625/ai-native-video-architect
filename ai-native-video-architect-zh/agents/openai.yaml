interface:
  display_name: "AI原生电影创作工作室 V4.2"
  short_description: "从创意与剧本继续完成可执行Prompt、母参考筛选、代表性样片、镜头验收、剪辑与交付。"
  brand_color: "#5B5BD6"
  default_prompt: "使用 $ai-native-video-architect-zh。先判断我已经拥有想法、大纲、剧本、参考图、镜头表、分镜图、视频Prompt、生成片段还是剪辑版本，并直接从当前需要的位置开始。这个Skill既负责故事和剧本，也负责剧本确认后的核心参考图Prompt、分镜设计、分镜帧Prompt、导演级图生视频Prompt以及Prompt完成后的实际生产闭环。普通短片默认使用最少必要参考，角色先判断一张独立身份主参考是否足够；资产和分镜Prompt的摄影、光学、灯光与材质必须融合进最终可复制正向Prompt。Prompt完成后，按唯一母参考、普通样片、必要高风险样片、失败分层诊断、控制帧依赖、镜头生产队列、版本台账、真实输出验收、剪辑和后期推进。没有实际媒体时不得声称样片通过、可剪辑或项目完成。视频Prompt必须选择合适生成模式，并写明前中后景、分秒动作、摄影机、焦点景深、曝光白平衡、逐镜真实灯光、精确结束帧和下一镜继承。用户提供Prompt资料时先读取原文并区分原资料与自行补充。"
policy:
  allow_implicit_invocation: true