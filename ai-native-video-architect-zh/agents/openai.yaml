interface:
  display_name: "AI原生电影创作工作室 V4.1"
  short_description: "从创意和剧本创作继续完成角色场景生图Prompt、分镜帧、视频Prompt、运镜、连续性、修复和后期方案。"
  brand_color: "#5B5BD6"
  default_prompt: "使用 $ai-native-video-architect-zh。先判断我已经拥有想法、大纲、剧本、参考图、分镜图还是其他成熟成果，并直接从当前需要的位置开始。这个Skill既负责故事和剧本创作，也负责剧本确认后的角色/场景/道具参考图Prompt、分镜设计、分镜帧Prompt、图生视频Prompt、运镜、连续性、修复和后期方案。已有剧本时不要强制重走创作流程；剧本由本Skill创作并确认后，也要继续完成后续生图、分镜和视频Prompt。普通短片默认使用最少必要参考图，不建立庞大资产库。用户提供Prompt资料时先读取原文，区分原资料与自行补充。只有任务跨度较大或我要求按步骤推进时才显示进度，不要要求我每生成一张图就回来确认。"
policy:
  allow_implicit_invocation: true
