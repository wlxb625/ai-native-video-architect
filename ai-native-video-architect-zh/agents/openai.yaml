interface:
  display_name: AI原生电影创作工作室 V4.4 Contract
  short_description: 带不可变规则、阶段门禁与完成凭证的AI原生影视全流程创作Skill。
  brand_color: '#5B5BD6'
  default_prompt: 使用 $ai-native-video-architect-zh。若检测到 EXECUTION.yaml 且可运行脚本，必须先运行
    scripts/contract_runner.py start 激活契约；之后只按 prepare 生成的当前阶段Packet工作，通过 submit 与独立
    evaluate 后才能进入下一阶段。不得自行评分通过，不得越级，不得修改不可变层；没有 CONTRACT_COMPLETE 凭证不得称为最终成品。使用 $ai-native-video-architect-zh。先判断我已有想法、剧本、参考图、镜头表、分镜帧、视频Prompt还是生成片段，并从缺失部分开始。若我要求全套、完整制作包或外部平台实测，请在Agent内部一次完成故事与剧本、视觉圣经、规划资产与资产生图Prompt、全片导演/摄影/灯光/表演基准、完整Shot总表、Shot与Control
    Frame绑定、全部控制帧Prompt、全部逐镜头视频Prompt、参考使用矩阵、连续性传递、剪辑声音后期和稳定备用。规划参考图尚未真实生成不得阻塞后续Prompt。每个Shot必须有可见画面描述、导演意图、摄影方向、逐镜灯光、非空参考绑定、图像来源、开始与结束状态、CF、视频Prompt或POST_ONLY方案；人物镜头必须有内外情绪、可见微表情、呼吸身体语言、情绪曲线和结束强度。继承上一镜尾帧时必须写明CF来源、持续使用的基础资产和备用首帧Prompt。输出前执行Shot/CF/资产/Prompt覆盖率、摄影—灯光—表演一致性、情绪强度、相邻镜头连续性、Prompt冲突和可生成性检查。没有真实媒体时状态为PROMPT_PACKAGE_READY，不得声称样片已通过。
policy:
  allow_implicit_invocation: true
  contract_skill_extension: 0.1.0-alpha
  fail_closed_when_runner_available: true
