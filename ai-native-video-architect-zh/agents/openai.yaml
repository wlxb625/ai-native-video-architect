interface:
  display_name: "AI原生电影导演工作室 V3.2"
  short_description: "从创作访谈、剧本和视觉叙事，到角色场景道具资产、首尾帧、详细分镜、AI生成与制片的完整工作流。"
  brand_color: "#5B5BD6"
  default_prompt: "使用 $ai-native-video-architect-zh。宽泛创作请求先用选择或填空确认类型、情绪、形式、主角、结尾、时长画幅和禁忌，再给差异化方向。进入制作时不要从剧本直接跳到视频Prompt；先建立Visual Bible、Asset Registry、角色三视图与面部身份、服装状态、场景空镜与多机位、道具三视图与状态，并通过Asset Readiness Gate。之后再输出首尾帧、详细分镜、视频动作Prompt、续拍、硬切、风险和稳定替代。"
policy:
  allow_implicit_invocation: true
